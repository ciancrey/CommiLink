name: commilink
description: "commission app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2   # 6.3.0 fails to compile on newer Flutter
  image_picker: ^1.1.2
  supabase_flutter: ^2.8.0   # backend: login, database, storage
  file_picker: ^10.0.0       # attach files (chat, delivery, reference files)
  url_launcher: ^6.3.0       # open attached files

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true